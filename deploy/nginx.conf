# notebooks.buddhilw.com. Same shape as nginx/presentations.conf, with two
# differences: the site is public, so crawlers are welcome, and the pages are
# Clerk static apps that load WebAssembly kernels (application/wasm comes from
# nginx's own mime.types).

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Behind the tunnel the scheme is https and the port 443, neither of which
    # nginx can see; an absolute /id -> /id/ redirect would name http and 8080.
    # A relative Location lets the browser keep the origin it already has.
    absolute_redirect off;

    access_log /dev/stdout combined;
    error_log  /dev/stderr warn;

    # The bundle under _data/ is content-hashed, and every other asset changes
    # only with the image tag. `expires` keeps the add_header set below intact.
    location ~* \.(js|mjs|css|wasm|jpg|jpeg|png|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        expires 30d;
    }

    # A page must not be cached: it is how a re-published notebook reaches a
    # browser that already holds the old one.
    location ~* \.html$ {
        expires -1;
    }

    # Notebook ids are directories; nginx 301s /id to /id/, which the relative
    # asset paths inside each page depend on.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/wasm image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    server_tokens off;
}
