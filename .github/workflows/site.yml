# Build the notebooks on every pull request; publish them when main moves.
#
# The `build` job is the required check on main: a pull request merges only
# when every notebook builds (each Emmy check runs at build time) and the
# offline browser test passes. A merge to main then pushes the image
# ghcr.io/buddhilw/notebooks:main-<sha>; Argo CD Image Updater
# picks up the newest main-* tag and rolls https://notebooks.buddhilw.com/.

name: site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # raster (the numeric backend) needs JDK 24 or later.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: history-of-math/package-lock.json

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: deps-${{ hashFiles('**/deps.edn') }}
          restore-keys: deps-

      - name: npm ci
        working-directory: history-of-math
        run: npm ci --no-audit --no-fund

      - name: Build every notebook
        working-directory: history-of-math
        run: clojure -J-Xmx4g -X:notebooks :out-path '"target/hom"'

      - name: Offline browser test over every notebook
        working-directory: history-of-math
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          (cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm i --no-audit --no-fund playwright \
             && npx playwright install --with-deps chromium)
          python3 -m http.server 8099 --bind 127.0.0.1 --directory target/hom &
          sleep 1
          pages=$(cd target/hom && ls -d */ | grep -vE '^(_data|css|vendor)/$')
          PLAYWRIGHT="$RUNNER_TEMP/pw" node dev/offline_e2e.mjs http://127.0.0.1:8099/ $pages > e2e.json
          node -e 'const j=require("./e2e.json"); for (const [k,v] of Object.entries(j.results)) console.log(v.ok ? "ok  " : "FAIL", k); process.exit(j.ok ? 0 : 1)'

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: history-of-math/target/hom
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - uses: docker/setup-buildx-action@v3

      # GHCR, not the gitea registry: hive-mcp.com runs Cloudflare Bot Fight
      # Mode, which answers 403 to GitHub's runners. The source label links the
      # package to this public repository.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ghcr.io/buddhilw/notebooks:main-<sha>
        run: |
          tag="main-${GITHUB_SHA::7}"
          docker buildx build --push \
            -f deploy/Dockerfile --build-context conf=deploy \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=$GITHUB_SHA \
            --label org.opencontainers.image.licenses="GPL-3.0-or-later AND CC-BY-SA-4.0" \
            -t "ghcr.io/buddhilw/notebooks:$tag" site
          echo "pushed $tag" >> "$GITHUB_STEP_SUMMARY"
